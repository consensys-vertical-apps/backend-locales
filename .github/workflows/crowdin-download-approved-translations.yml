name: Crowdin Download Approved Translations

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  download-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write

    steps:
      - name: Get token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use installation token to ensure that the commit later can trigger status check workflows
          token: ${{ steps.get-token.outputs.token }}

      - name: Crowdin download approved translations
        uses: crowdin/github-action@a3160b9e5a9e00739392c23da5e580c6cabe526d
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          export_only_approved: true
          # The action's own git commit is unsigned. Publishing is done below
          # so GitHub can sign the commit as the token-exchange app.
          push_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Publish signed commit and open pull request
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: python3 .github/scripts/publish-signed-crowdin-commit.py
